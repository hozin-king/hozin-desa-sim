apply plugin: 'com.android.application'

android {
    namespace "com.hozinking.desasim"
    compileSdk 34

    defaultConfig {
        applicationId "com.hozinking.desasim"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
    }

    signingConfigs {
        // Keystore debug persisten (secret repo DEBUG_KEYSTORE_BASE64).
        // Config HANYA dibuat bila file keystore ada.
        if (file("../debug.keystore").exists()) {
            debug {
                storeFile file("../debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            if (file("../debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // .so native libGDX disalin task copyAndroidNatives ke libs/ — beritahu AGP.
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

configurations { natives }

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
}

// Ekstrak .so native libGDX ke libs/ supaya terkemas ke APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/arm64-v8a').mkdirs()
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}
